<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css 선택자</title>
    <!-- <link> CSS 파일 연결 -->
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- 태그 선택자 -->
    <h1>CSS선택자</h1>
    <P>p 태그 색상 변경</P>
    <p>p 태그 글자 사이즈 변경</p>
    <!-- 클래스 선택자 -->
    <h2 class="menu1">김치찌개</h2>
    <h2 class="menu2">돤장찌개</h2>
    <h2 class="menu3">비빔밥</h2>
    <!-- div.box : 클래스 바로 생성-->
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <!-- id 선택자 -->
    <span id="title">오늘의 메뉴</span>
    <!-- p#title2 -->
    <p id="title2">
        오늘의 할 일
    </p>
    <!-- id는 하나만 class는 여러개 가능 -->
    <p id="subtitle" class="subtitle subtitle2">오늘의 메뉴</p>
    <!-- 여러 선택자 한번에 선택 -->
    <h4>메뉴</h4>
    <p class="dask">Lorem ipsum dolor sit amet.</p>
    <span class="smalltitle">안녕하세요</span>
    
</body>
</html>
