<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 우선 선택자</title>
    <style>
        /* id>class>tag>* */
        *{
            color: blue;
        }
        p{
            color: aqua;
        }
        /* ! important 가장 높은 우선순위 / 잘 사용하지 않는다 */
        .text{
            color: red !important;
        }
        #title{
            color: blueviolet;
        }
        .text{
            color: green;
        }
    </style>
</head>
<body>
    <p id="title" class="text">안녕하세요.</p>
    <p class="text">반갑습니다.</p>
</body>
</html>
